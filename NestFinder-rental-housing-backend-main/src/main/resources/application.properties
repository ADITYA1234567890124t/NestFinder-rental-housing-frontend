# ==============================
# SERVER CONFIGURATION
# ==============================
server.port=8080
spring.application.name=rental-housing-api

# ==============================
# ACTIVE PROFILE
# ==============================
spring.profiles.active=dev

# ==============================
# POSTGRESQL DATABASE CONFIGURATION
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/rental_housing_db

spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT CONFIGURATION
# ==============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==============================
# CLOUDINARY CONFIGURATION #
# ==============================
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret
# ==============================
# FILE UPLOAD LIMIT
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ==============================
# EMAIL CONFIGURATION (GMAIL)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_16_DIGIT_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# SPRING ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Disable mail health check if mail not configured
management.health.mail.enabled=false

# ==============================
# LOGGING
# ==============================
logging.level.com.rentalhousing=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


